<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standard Calculator</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    text-align:center;
    padding-top:40px;
}

.calculator{
    width:240px;
    margin:auto;
    background:#d9d9d9;
    padding:10px;
    border:1px solid #9a9a9a;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
}

.preview{
    width:100%;
    height:22px;
    text-align:right;
    font-size:14px;
    color:#555;
    padding:2px 6px 0 6px;
    box-sizing:border-box;
    overflow:hidden;
}

#display{
    width:100%;
    height:42px;
    font-size:22px;
    text-align:right;
    padding:0 8px;
    box-sizing:border-box;
    margin-bottom:8px;
    border:1px solid #9e9e9e;
    background:#fff;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:4px;
}

button{
    height:32px;
    font-size:16px;
    font-weight:bold;
    border:1px solid #7f9db9;
    background:linear-gradient(#ffffff,#dbe8f7);
    cursor:pointer;
}

button:hover{
    background:linear-gradient(#ffffff,#cfe0f5);
}

.clear-wrap{
    margin-top:8px;
    text-align:center;
}

.clear-btn{
    width:90px;
    height:36px;
    font-size:16px;
    font-weight:bold;
}

.info{
    margin-top:18px;
    font-size:14px;
    color:#333;
    min-height:60px;
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#666;
}
</style>
</head>
<body>

<h2>Standard Calculator</h2>

<div class="calculator">
    <div id="preview" class="preview"></div>
    <input type="text" id="display" value="0" disabled>

    <div class="buttons">
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button onclick="setOperator('+')">+</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button onclick="setOperator('-')">-</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="setOperator('*')">*</button>

        <button onclick="showDeveloper()">A</button>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="showApp()">B</button>
        <button onclick="setOperator('/')">/</button>

        <div></div>
        <div></div>
        <div></div>
        <button onclick="calculate()">=</button>
    </div>

    <div class="clear-wrap">
        <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>
</div>

<div id="info" class="info"></div>

<div class="footer">
© Activity 10 - MSIT 114
</div>

<script>
let display = document.getElementById("display");
let preview = document.getElementById("preview");
let info = document.getElementById("info");

let firstValue = null;
let operator = null;
let waitingForSecond = false;
let justCalculated = false;

function updateDisplay(value){
    display.value = value;
}

function appendNumber(num){
    if(display.value === "0" || waitingForSecond || justCalculated){
        display.value = num;
        waitingForSecond = false;
        justCalculated = false;
    }else{
        display.value += num;
    }

    if(firstValue !== null && operator !== null){
        preview.textContent = formatNumber(firstValue) + " " + operator;
    }
}

function setOperator(op){
    const current = parseFloat(display.value);

    if(firstValue === null){
        firstValue = current;
    }else if(operator !== null && !waitingForSecond){
        firstValue = operate(firstValue, current, operator);
        updateDisplay(formatNumber(firstValue));
    }

    operator = op;
    waitingForSecond = true;
    justCalculated = false;
    preview.textContent = formatNumber(firstValue) + " " + operator;
}

function calculate(){
    if(firstValue === null || operator === null) return;

    const secondValue = parseFloat(display.value);
    const expressionText = formatNumber(firstValue) + " " + operator + " " + formatNumber(secondValue) + " =";
    const result = operate(firstValue, secondValue, operator);

    preview.textContent = expressionText;
    updateDisplay(formatNumber(result));

    firstValue = result;
    operator = null;
    waitingForSecond = false;
    justCalculated = true;
}

function operate(a, b, op){
    switch(op){
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return b === 0 ? 0 : a / b;
        default: return b;
    }
}

function formatNumber(num){
    if(!isFinite(num)) return "0";
    if(Number.isInteger(num)){
        return num.toString();
    }
    return parseFloat(num.toFixed(10)).toString();
}

function clearAll(){
    firstValue = null;
    operator = null;
    waitingForSecond = false;
    justCalculated = false;
    preview.textContent = "";
    display.value = "0";
    info.innerHTML = "";
}

function backspace(){
    if(waitingForSecond || justCalculated) return;

    if(display.value.length > 1){
        display.value = display.value.slice(0, -1);
    }else{
        display.value = "0";
    }
}

function showDeveloper(){
    info.innerHTML =
        "<b>Developer:</b> Hex Allain J. Guirigay<br>" +
        "MSIT-114<br>" +
        "Schools Division Office of Zamboanga del Sur";
}

function showApp(){
    info.innerHTML =
        "<b>Application:</b> Standard Web Calculator<br>" +
        "Created using HTML, CSS, and JavaScript<br>" +
        "This calculator performs basic arithmetic operations just like the Windows OS standard calculator.";
}

/* Keyboard support */
document.addEventListener("keydown", function(e){
    const key = e.key;

    if(key >= "0" && key <= "9"){
        appendNumber(key);
        e.preventDefault();
        return;
    }

    if(key === "+" || key === "-" || key === "*" || key === "/"){
        setOperator(key);
        e.preventDefault();
        return;
    }

    if(key === "Enter" || key === "="){
        calculate();
        e.preventDefault();
        return;
    }

    if(key === "Backspace"){
        backspace();
        e.preventDefault();
        return;
    }

    if(key === "Escape" || key === "Delete"){
        clearAll();
        e.preventDefault();
        return;
    }

    if(key === "a" || key === "A"){
        showDeveloper();
        e.preventDefault();
        return;
    }

    if(key === "b" || key === "B"){
        showApp();
        e.preventDefault();
        return;
    }
});
</script>

</body>
</html>
